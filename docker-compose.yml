services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: soroban-testbench-dev
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    environment:
      - NODE_ENV=development
      - WATCHPACK_POLLING=true
      - NEXT_PUBLIC_SOROBAN_TESTBENCH_DEMO_MODE=true
      - NEXT_PUBLIC_DEFAULT_NETWORK=testnet